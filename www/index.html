<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TV 应用商店</title>
<style>
  /*
    TV 多分辨率适配策略：
    基准 = 1920×1080 (FHD)，所有尺寸用 clamp() 在 1280p~3840p 之间平滑缩放
  */
  :root {
    --bg: #0f0f14;
    --card: #1a1a24;
    --card-hover: #252538;
    --focus: #6366f1;
    --focus-glow: rgba(99, 102, 241, 0.35);
    --text: #f0f0f5;
    --text-dim: #8888a0;
    --accent: #818cf8;
    --section-bg: #14141e;
    --focus-border: #a5b4fc;
    --radius: clamp(8px, 0.625vw, 16px);
    --tile-radius: clamp(10px, 0.73vw, 18px);
    --side-pad: clamp(20px, 2.5vw, 64px);
    --section-gap: clamp(16px, 1.88vw, 48px);
    --row-gap: clamp(8px, 0.83vw, 20px);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
    -webkit-user-select: none;
    cursor: none;
  }
  .app-container { width:100%; height:100%; display:grid; grid-template-rows:auto 1fr; }

  /* 顶部导航栏 */
  .top-bar {
    display:flex; align-items:center;
    padding: clamp(8px, 0.83vw, 20px) var(--side-pad);
    gap: clamp(16px, 2.1vw, 48px);
    background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);
    z-index:10;
  }
  .logo { font-size:clamp(16px,1.35vw,32px); font-weight:800; color:var(--accent); white-space:nowrap; }
  .top-tabs { display:flex; gap:clamp(12px,1.67vw,36px); }
  .top-tab {
    font-size:clamp(13px,0.94vw,22px); color:var(--text-dim); padding:.5em 0;
    border:none; background:none; font-family:inherit; cursor:pointer; transition:.2s;
    position:relative; white-space:nowrap;
  }
  .top-tab.focused,.top-tab.active { color:#fff; outline:none; font-weight:600; }
  .top-tab.focused::after,.top-tab.active::after {
    content:''; position:absolute; bottom:0; left:0; right:0;
    height:clamp(2px,0.16vw,4px); background:var(--focus); border-radius:3px;
  }
  .search-icon {
    margin-left:auto; font-size:clamp(18px,1.25vw,30px); color:var(--text-dim);
    padding:.3em; cursor:pointer; background:none; border:none; transition:.2s;
  }
  .search-icon.focused { color:#fff; transform:scale(1.15); }

  /* 内容区 */
  .content-area {
    overflow-y:auto; overflow-x:hidden; padding:0 var(--side-pad) clamp(16px,2vw,48px);
    scroll-behavior:smooth;
  }
  .content-area::-webkit-scrollbar { width:6px; }
  .content-area::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); border-radius:3px; }

  /* Section */
  .section { margin-bottom:var(--section-gap); }
  .section-header { display:flex; align-items:center; gap:clamp(6px,0.63vw,16px); margin-bottom:clamp(8px,0.83vw,20px); }
  .section-title { font-size:clamp(15px,1.15vw,26px); font-weight:700; }
  .section-subtitle { font-size:clamp(11px,0.73vw,16px); color:var(--text-dim); }

  /* 横向滚动行 */
  .app-row {
    display:flex; gap:var(--row-gap); overflow-x:auto; padding:clamp(4px,0.42vw,10px) 0;
    scroll-behavior:smooth; scrollbar-width:none;
  }
  .app-row::-webkit-scrollbar { display:none; }

  /* ─── 应用卡片（核心优化）─── */
  .app-card {
    flex-shrink:0;
    /* 宽: 1280→120, 1920→170, 3840→220 */
    width:clamp(120px, 8.3vw, 220px);
    padding:clamp(8px, 0.78vw, 18px);
    background:var(--card); border-radius:var(--tile-radius);
    text-align:center; transition:all .18s ease; cursor:pointer;
    border:2px solid transparent; position:relative; overflow:hidden;
  }
  .app-card.focused {
    transform:scale(1.08); background:var(--card-hover);
    border-color:var(--focus-border);
    box-shadow:0 0 clamp(16px,1.25vw,32px) var(--focus-glow), 0 8px 24px rgba(0,0,0,.4);
    z-index:5;
  }
  /* 图标：1280→50, 1920→72, 3840→92 */
  .app-card .icon-wrap {
    width:clamp(50px, 3.75vw, 92px); height:clamp(50px, 3.75vw, 92px);
    margin:0 auto clamp(6px, 0.63vw, 14px);
    border-radius:clamp(10px, 0.78vw, 18px); overflow:hidden;
    background:#2a2a3a; display:flex; align-items:center; justify-content:center;
    font-size:clamp(26px, 2.1vw, 50px);
  }
  .app-card .icon-wrap img { width:100%; height:100%; object-fit:cover; }
  .app-card .name {
    font-size:clamp(11px, 0.78vw, 17px); font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:3px;
  }
  .app-card .meta { font-size:clamp(9.5px, 0.63vw, 13.5px); color:var(--text-dim); display:flex; align-items:center; justify-content:center; gap:4px; }
  .app-card .rating { color:#fbbf24; }

  /* ─── 精选推荐横幅 ─── */
  .featured-row { display:flex; gap:var(--row-gap); overflow-x:auto; padding:clamp(4px,0.42vw,10px) 0; scrollbar-width:none; }
  .featured-row::-webkit-scrollbar { display:none; }
  .featured-card {
    flex-shrink:0;
    /* 1280→300×165, 1920→440×240, 3840→580×310 */
    width:clamp(300px, 23vw, 580px); height:clamp(165px, 12.5vw, 310px);
    background:linear-gradient(135deg, #1e1b4b, #312e81); border-radius:clamp(10px,0.83vw,20px);
    padding:clamp(14px, 1.46vw, 32px);
    display:flex; flex-direction:column; justify-content:flex-end;
    position:relative; overflow:hidden; cursor:pointer;
    border:2px solid transparent; transition:all .18s ease;
  }
  .featured-card::before {
    content:''; position:absolute; top:-15%; right:-10%;
    width:clamp(100px, 10.4vw, 240px); height:clamp(100px, 10.4vw, 240px);
    border-radius:50%; background:rgba(255,255,255,.03);
  }
  .featured-card.focused {
    transform:scale(1.03); border-color:var(--focus-border);
    box-shadow:0 0 clamp(16px,1.5vw,36px) var(--focus-glow), 0 10px 30px rgba(0,0,0,.5); z-index:5;
  }
  .featured-card .f-icon { font-size:clamp(36px, 3.75vw, 80px); margin-bottom:clamp(6px,0.63vw,14px); }
  .featured-card .f-icon img { width:clamp(44px, 3.75vw, 80px); height:clamp(44px, 3.75vw, 80px); border-radius:clamp(8px,0.83vw,18px); object-fit:cover; }
  .featured-card .f-name { font-size:clamp(16px, 1.35vw, 30px); font-weight:800; margin-bottom:4px; }
  .featured-card .f-desc {
    font-size:clamp(10px,0.73vw,16px); color:rgba(255,255,255,.7); line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .featured-card .f-badge {
    display:inline-block; background:rgba(255,255,255,.15);
    padding:clamp(2px,0.16vw,4px) clamp(6px,0.52vw,12px);
    border-radius:10px; font-size:clamp(9px,0.63vw,13px); margin-bottom:clamp(6px,0.52vw,12px); width:fit-content;
  }

  /* ─── 分类网格 ─── */
  .category-grid { display:flex; flex-wrap:wrap; gap:var(--row-gap); }
  .category-card {
    /* 1280→140×65, 1920→200×94, 3840→260×120 */
    width:clamp(140px, 10.4vw, 260px); height:clamp(65px, 4.9vw, 120px);
    background:var(--card); border-radius:var(--radius);
    display:flex; align-items:center; gap:clamp(8px,0.73vw,16px);
    padding:0 clamp(10px,1vw,24px); cursor:pointer;
    border:2px solid transparent; transition:all .18s ease;
  }
  .category-card.focused {
    transform:scale(1.05); background:var(--card-hover);
    border-color:var(--focus-border); box-shadow:0 0 20px var(--focus-glow); z-index:5;
  }
  .category-card .cat-icon { font-size:clamp(22px, 1.88vw, 42px); }
  .category-card .cat-name { font-size:clamp(13px, 0.94vw, 20px); font-weight:600; }

  /* ─── 详情页 ─── */
  .detail-page {
    display:none; position:absolute; inset:0; background:var(--bg);
    z-index:50; flex-direction:column; overflow-y:auto;
  }
  .detail-page.active { display:flex; }
  .detail-hero {
    background:linear-gradient(135deg,#1e1b4b,#0f0f14 60%);
    padding:clamp(16px,2vw,48px) var(--side-pad);
    display:flex; gap:clamp(12px,1.46vw,32px); align-items:flex-start;
  }
  .detail-icon {
    width:clamp(68px, 6.25vw, 150px); height:clamp(68px, 6.25vw, 150px);
    border-radius:clamp(14px, 1.25vw, 28px); background:#2a2a3a;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(32px, 2.9vw, 68px); flex-shrink:0; overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .detail-icon img { width:100%; height:100%; object-fit:cover; }
  .detail-info { flex:1; }
  .detail-info h1 { font-size:clamp(20px, 1.67vw, 38px); font-weight:800; margin-bottom:6px; }
  .detail-info .detail-meta {
    display:flex; gap:clamp(8px,1vw,24px); flex-wrap:wrap; align-items:center;
    font-size:clamp(11px,0.78vw,17px); color:var(--text-dim); margin-bottom:10px;
  }
  .detail-info .detail-meta .rating { color:#fbbf24; font-weight:600; }
  .detail-info .detail-desc {
    font-size:clamp(11px,0.78vw,17px); line-height:1.7;
    color:rgba(255,255,255,.7); margin-bottom:16px;
  }
  .detail-actions { display:flex; gap:clamp(6px,0.63vw,14px); }
  .btn-download {
    display:inline-flex; align-items:center; gap:6px;
    padding:clamp(9px,0.73vw,16px) clamp(18px,1.67vw,36px);
    background:var(--focus); color:#fff; border:none;
    border-radius:clamp(6px,0.52vw,12px); font-size:clamp(13px,0.94vw,20px);
    font-weight:700; cursor:pointer; transition:.2s; font-family:inherit;
  }
  .btn-download.focused { transform:scale(1.06); box-shadow:0 0 clamp(12px,1.2vw,28px) var(--focus-glow); }
  .btn-back {
    display:inline-flex; align-items:center; gap:4px;
    padding:clamp(8px,0.73vw,16px) clamp(12px,1.25vw,28px);
    background:rgba(255,255,255,.08); color:#fff; border:none;
    border-radius:clamp(6px,0.52vw,12px); font-size:clamp(12px,0.83vw,18px);
    font-weight:600; cursor:pointer; transition:.2s; font-family:inherit;
  }
  .btn-back.focused { background:rgba(255,255,255,.15); box-shadow:0 0 16px rgba(255,255,255,.1); }
  .detail-screenshots { padding:clamp(12px,1.25vw,28px) var(--side-pad); }
  .detail-screenshots h3 { font-size:clamp(14px,1vw,22px); margin-bottom:clamp(8px,0.83vw,18px); }
  .screenshot-row { display:flex; gap:var(--row-gap); overflow-x:auto; padding:4px 0; scrollbar-width:none; }
  .screenshot-row::-webkit-scrollbar { display:none; }
  .screenshot-row img {
    height:clamp(100px, 10.4vw, 240px); border-radius:clamp(6px,0.52vw,12px);
    flex-shrink:0; border:1px solid rgba(255,255,255,.06);
  }

  /* ─── 搜索页 ─── */
  .search-page {
    display:none; position:absolute; inset:0; background:var(--bg);
    z-index:50; flex-direction:column; padding:clamp(14px,1.67vw,36px) var(--side-pad);
  }
  .search-page.active { display:flex; }
  .search-input-wrap { display:flex; align-items:center; gap:clamp(6px,0.63vw,14px); margin-bottom:clamp(12px,1.25vw,28px); }
  .search-input-wrap input {
    flex:1; padding:clamp(9px,0.83vw,18px) clamp(10px,1vw,24px);
    background:var(--card); border:2px solid transparent; border-radius:var(--radius);
    color:#fff; font-size:clamp(15px,1.15vw,26px); font-family:inherit; outline:none; transition:.2s;
  }
  .search-input-wrap input.focused { border-color:var(--focus); box-shadow:0 0 20px var(--focus-glow); }
  .search-input-wrap input::placeholder { color:var(--text-dim); }
  .search-results { display:flex; flex-wrap:wrap; gap:var(--row-gap); }

  /* ─── 提示条 ─── */
  .nav-hint {
    position:fixed; bottom:clamp(8px,1vw,24px); left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,.06); padding:clamp(5px,0.52vw,12px) clamp(12px,1.25vw,28px);
    border-radius:20px; font-size:clamp(10px,0.68vw,14px); color:var(--text-dim);
    display:flex; gap:clamp(8px,1vw,24px); z-index:60; pointer-events:none;
    opacity:1; transition:opacity .6s ease;
  }
  .nav-hint.hidden { opacity:0; }
  .nav-hint span { display:flex; align-items:center; gap:3px; }
  .nav-hint kbd {
    display:inline-block; background:rgba(255,255,255,.1);
    padding:2px 6px; border-radius:4px; font-family:inherit; font-size:clamp(9px,0.57vw,12px);
  }

  /* ─── 分类应用列表页 ─── */
  .category-apps-page {
    display:none; position:absolute; inset:0; background:var(--bg);
    z-index:50; flex-direction:column; overflow-y:auto;
  }
  .category-apps-page.active { display:flex; }
  .category-apps-header {
    display:flex; align-items:center; gap:clamp(8px,0.83vw,18px);
    padding:clamp(14px,1.67vw,36px) var(--side-pad) clamp(8px,1vw,24px);
  }
  .category-apps-header h2 { font-size:clamp(18px,1.46vw,32px); font-weight:800; flex:1; }
  .category-apps-grid { display:flex; flex-wrap:wrap; gap:var(--row-gap); padding:0 var(--side-pad) clamp(16px,1.67vw,36px); }

  /* ─── 空状态 ─── */
  .empty-state { text-align:center; padding:clamp(24px,3vw,80px) 5vw; color:var(--text-dim); }
  .empty-state .empty-icon { font-size:clamp(36px,3.3vw,72px); margin-bottom:clamp(8px,0.83vw,18px); }
  .empty-state p { font-size:clamp(13px,0.94vw,20px); }
</style>
</head>
<body>

<div class="app-container">

  <!-- 顶部导航 -->
  <div class="top-bar" id="top-bar">
    <div class="logo">📺 AppStore TV</div>
    <div class="top-tabs" id="top-tabs">
      <button class="top-tab active focused" data-tab="home" tabindex="-1" onclick="renderHome()">首页</button>
      <button class="top-tab" data-tab="categories" tabindex="-1" onclick="renderCategories()">分类</button>
      <button class="top-tab" data-tab="rank" tabindex="-1" onclick="renderRank()">排行榜</button>
    </div>
    <button class="search-icon" id="search-btn" tabindex="-1" onclick="openSearch()">🔍</button>
  </div>

  <!-- 主内容区 -->
  <div class="content-area" id="main-content"></div>

  <!-- 详情页 -->
  <div class="detail-page" id="detail-page">
    <div class="detail-hero" id="detail-hero"></div>
    <div class="detail-screenshots" id="detail-screenshots"></div>
  </div>

  <!-- 搜索页 -->
  <div class="search-page" id="search-page">
    <div class="search-input-wrap">
      <button class="btn-back" id="search-back-btn" tabindex="-1">← 返回</button>
      <input type="text" id="search-input" placeholder="输入搜索关键词..." autocomplete="off">
    </div>
    <div class="search-results" id="search-results"></div>
  </div>

  <!-- 分类应用列表页 -->
  <div class="category-apps-page" id="category-apps-page">
    <div class="category-apps-header">
      <button class="btn-back" id="cat-back-btn" tabindex="-1">← 返回</button>
      <h2 id="cat-apps-title"></h2>
    </div>
    <div class="category-apps-grid" id="category-apps-grid"></div>
  </div>

  <!-- 键盘操作提示 -->
  <div class="nav-hint">
    <span><kbd>↑↓←→</kbd> 导航</span>
    <span><kbd>Enter</kbd> 选择</span>
    <span><kbd>Esc</kbd> 返回</span>
  </div>

</div>

<script>
// ⚙️ API 服务器地址 — 部署后修改为你的后端 IP:端口
const API_SERVER = 'http://192.227.150.38:3000';
const API = API_SERVER + '/api';

function resolveUrl(url) {
  if (!url) return '';
  if (/^https?:\/\//i.test(url)) return url;
  return API_SERVER + (url.startsWith('/') ? '' : '/') + url;
}

// ======== 全局状态 ========
let currentPage = 'main'; // main | detail | search | category-apps
let currentTab = 'home';
let focusableElements = [];
let focusIndex = 0;
let homeData = null;

// ======== 焦点管理 ========
function collectFocusables() {
  focusableElements = Array.from(document.querySelectorAll(
    '.app-card, .featured-card, .category-card, .top-tab, .search-icon, .btn-download, .btn-back, #search-input, #search-results .app-card, #category-apps-grid .app-card'
  )).filter(el => {
    // 只收集可见页面中的元素
    if (currentPage === 'main') {
      return el.closest('#main-content') || el.closest('#top-bar');
    } else if (currentPage === 'detail') {
      return el.closest('#detail-page');
    } else if (currentPage === 'search') {
      return el.closest('#search-page');
    } else if (currentPage === 'category-apps') {
      return el.closest('#category-apps-page');
    }
    return false;
  });
}

function updateFocus() {
  focusableElements.forEach(el => el.classList.remove('focused'));
  if (focusableElements.length === 0) return;
  if (focusIndex >= focusableElements.length) focusIndex = 0;
  if (focusIndex < 0) focusIndex = focusableElements.length - 1;
  const el = focusableElements[focusIndex];
  el.classList.add('focused');
  // 滚动到可见
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
}

// ======== 首页渲染 ========
async function renderHome() {
  if (!homeData) {
    try {
      const res = await fetch(`${API}/home`).then(r => r.json());
      if (!res.success) throw new Error(res.message || 'API 返回失败');
      homeData = res.data;
    } catch (err) {
      console.error('加载首页数据失败:', err);
      document.getElementById('main-content').innerHTML = `
        <div class="section" style="padding:60px;text-align:center;color:#ff6b6b;">
          <div style="font-size:24px;margin-bottom:20px;">⚠️ 无法连接服务器</div>
          <div style="font-size:16px;color:#94a3b8;margin-bottom:20px;">${esc(err.message)}</div>
          <div style="font-size:14px;color:#64748b;">请检查 TV 前端的 API_SERVER 地址是否正确，以及服务器是否允许跨域。</div>
        </div>`;
      return;
    }
  }
  const d = homeData;
  let html = '';

  // 精选推荐横幅
  if (d.featured && d.featured.length) {
    html += `<div class="section">
      <div class="section-header"><span class="section-title">✨ 精选推荐</span></div>
      <div class="featured-row">`;
    d.featured.forEach((a, i) => {
      const iconHtml = a.icon ? `<img src="${resolveUrl(a.icon)}">` : '<span>📱</span>';
      html += `<div class="featured-card" data-app-id="${a.id}" onclick="openDetail(${a.id})">
        <div class="f-badge">${esc(a.category_name || '推荐')}</div>
        <div class="f-icon">${iconHtml}</div>
        <div class="f-name">${esc(a.name)}</div>
        <div class="f-desc">${esc(a.description || '')}</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  // 编辑精选
  if (d.recommended && d.recommended.length) {
    html += `<div class="section">
      <div class="section-header"><span class="section-title">🏆 编辑精选</span><span class="section-subtitle">品质之选</span></div>
      <div class="app-row">`;
    d.recommended.forEach(a => html += appCardHTML(a));
    html += `</div></div>`;
  }

  // 最新上架
  if (d.newest && d.newest.length) {
    html += `<div class="section">
      <div class="section-header"><span class="section-title">🆕 最新上架</span></div>
      <div class="app-row">`;
    d.newest.forEach(a => html += appCardHTML(a));
    html += `</div></div>`;
  }

  // 热门下载
  if (d.popular && d.popular.length) {
    html += `<div class="section">
      <div class="section-header"><span class="section-title">🔥 热门下载</span></div>
      <div class="app-row">`;
    d.popular.forEach(a => html += appCardHTML(a));
    html += `</div></div>`;
  }

  // 全部分类
  if (d.categories && d.categories.length) {
    html += `<div class="section">
      <div class="section-header"><span class="section-title">📂 全部分类</span></div>
      <div class="category-grid">`;
    d.categories.forEach(c => {
      html += `<div class="category-card" data-cat-id="${c.id}" data-cat-name="${esc(c.name)}" onclick="openCategoryApps(${c.id}, '${esc(c.name)}')">
        <span class="cat-icon">${c.icon || '📱'}</span>
        <span class="cat-name">${esc(c.name)}</span>
      </div>`;
    });
    html += `</div></div>`;
  }

  document.getElementById('main-content').innerHTML = html;
  setTab('home');
  currentPage = 'main';
  hideAllPages();
  document.getElementById('main-content').style.display = '';
  document.getElementById('top-bar').style.display = '';
  switchPage('main');
}

function appCardHTML(a) {
  const iconHtml = a.icon ? `<img src="${resolveUrl(a.icon)}">` : '<span>📱</span>';
  return `<div class="app-card" data-app-id="${a.id}" onclick="openDetail(${a.id})">
    <div class="icon-wrap">${iconHtml}</div>
    <div class="name">${esc(a.name)}</div>
    <div class="meta">
      <span class="rating">★ ${(a.rating || 0).toFixed(1)}</span>
      <span>${esc(a.size)}</span>
    </div>
  </div>`;
}

// ======== 分类页 ========
function renderCategories() {
  currentPage = 'main';
  hideAllPages();
  document.getElementById('main-content').style.display = '';
  document.getElementById('top-bar').style.display = '';

  document.getElementById('main-content').innerHTML = `
    <div class="section">
      <div class="section-header"><span class="section-title">📂 全部分类</span></div>
      <div class="category-grid" id="categories-grid"></div>
    </div>
  `;

  fetch(`${API}/categories`).then(r => r.json()).then(res => {
    const grid = document.getElementById('categories-grid');
    grid.innerHTML = res.data.map(c => `
      <div class="category-card" data-cat-id="${c.id}" data-cat-name="${esc(c.name)}" onclick="openCategoryApps(${c.id}, '${esc(c.name)}')">
        <span class="cat-icon">${c.icon || '📱'}</span>
        <span class="cat-name">${esc(c.name)}</span>
      </div>
    `).join('');
    collectFocusables();
    focusIndex = 0;
    updateFocus();
  });

  setTab('categories');
  switchPage('main');
}

// ======== 排行榜 ========
async function renderRank() {
  currentPage = 'main';
  hideAllPages();
  document.getElementById('main-content').style.display = '';
  document.getElementById('top-bar').style.display = '';

  const res = await fetch(`${API}/apps?pageSize=30`).then(r => r.json());
  const apps = res.data.sort((a,b) => b.download_count - a.download_count);

  document.getElementById('main-content').innerHTML = `
    <div class="section">
      <div class="section-header"><span class="section-title">🔥 下载排行榜</span></div>
      <div class="app-row" style="flex-wrap:wrap;">${apps.map(a => appCardHTML(a)).join('')}</div>
    </div>
  `;

  setTab('rank');
  collectFocusables();
  focusIndex = 0;
  updateFocus();
  switchPage('main');
}

// ======== 分类应用列表 ========
async function openCategoryApps(catId, catName) {
  currentPage = 'category-apps';
  hideAllPages();
  document.getElementById('category-apps-page').classList.add('active');

  document.getElementById('cat-apps-title').textContent = `${catName}`;

  const res = await fetch(`${API}/apps?category_id=${catId}&pageSize=50`).then(r => r.json());
  const apps = res.data;

  document.getElementById('category-apps-grid').innerHTML = apps.length
    ? apps.map(a => appCardHTML(a)).join('')
    : `<div class="empty-state"><div class="empty-icon">📭</div><p>该分类暂无应用</p></div>`;

  collectFocusables();
  // 默认聚焦第一个返回按钮
  const backBtns = focusableElements.filter(el => el.id === 'cat-back-btn');
  focusIndex = focusableElements.indexOf(backBtns[0]);
  if (focusIndex < 0) focusIndex = 0;
  updateFocus();
}

// ======== 详情页 ========
async function openDetail(appId) {
  currentPage = 'detail';
  hideAllPages();
  document.getElementById('detail-page').classList.add('active');

  const res = await fetch(`${API}/apps/${appId}`).then(r => r.json());
  const a = res.data;

  const iconHtml = a.icon
    ? `<img src="${resolveUrl(a.icon)}">`
    : '<span>📱</span>';

  document.getElementById('detail-hero').innerHTML = `
    <div class="detail-icon">${iconHtml}</div>
    <div class="detail-info">
      <h1>${esc(a.name)}</h1>
      <div class="detail-meta">
        <span>${esc(a.developer)}</span>
        <span class="rating">★ ${(a.rating || 0).toFixed(1)}</span>
        <span>${esc(a.size)}</span>
        <span>v${esc(a.version)}</span>
        <span>${a.download_count} 次下载</span>
      </div>
      <div class="detail-desc">${esc(a.description) || '暂无描述'}</div>
      <div class="detail-actions">
        <button class="btn-download" onclick="downloadApp(${a.id}, '${esc(a.package_name)}')">⬇ 安装</button>
        <button class="btn-back" onclick="goBack()">← 返回</button>
      </div>
    </div>
  `;

  const screenshots = a.screenshots;
  if (screenshots && screenshots.length) {
    document.getElementById('detail-screenshots').innerHTML = `
      <h3>📸 应用截图</h3>
      <div class="screenshot-row">
        ${screenshots.map(s => `<img src="${resolveUrl(s)}" alt="截图">`).join('')}
      </div>
    `;
    document.getElementById('detail-screenshots').style.display = '';
  } else {
    document.getElementById('detail-screenshots').style.display = 'none';
  }

  collectFocusables();
  // 默认聚焦下载按钮
  const downloadBtns = focusableElements.filter(el => el.className.includes('btn-download'));
  focusIndex = focusableElements.indexOf(downloadBtns[0]);
  if (focusIndex < 0) focusIndex = 0;
  updateFocus();
}

// ======== 搜索 ========
function openSearch() {
  currentPage = 'search';
  hideAllPages();
  document.getElementById('search-page').classList.add('active');
  document.getElementById('search-input').value = '';
  document.getElementById('search-results').innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><p>输入关键词搜索应用</p></div>';

  collectFocusables();
  const input = document.getElementById('search-input');
  focusIndex = focusableElements.indexOf(input);
  if (focusIndex < 0) focusIndex = 0;
  updateFocus();
}

function closeSearch() {
  document.getElementById('search-page').classList.remove('active');
  currentPage = 'main';
  document.getElementById('top-bar').style.display = '';
  document.getElementById('main-content').style.display = '';
  switchPage('main');
}

let searchTimer;
document.getElementById('search-input').addEventListener('input', function() {
  clearTimeout(searchTimer);
  const q = this.value.trim();
  if (!q) {
    document.getElementById('search-results').innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><p>输入关键词搜索应用</p></div>';
    return;
  }
  searchTimer = setTimeout(async () => {
    const res = await fetch(`${API}/search?q=${encodeURIComponent(q)}`).then(r => r.json());
    const apps = res.data;
    document.getElementById('search-results').innerHTML = apps.length
      ? apps.map(a => appCardHTML(a)).join('')
      : `<div class="empty-state"><div class="empty-icon">🔍</div><p>未找到 "${esc(q)}" 相关应用</p></div>`;
    collectFocusables();
    updateFocus();
  }, 300);
});

document.getElementById('search-back-btn').addEventListener('click', closeSearch);
document.getElementById('cat-back-btn').addEventListener('click', goBack);

// ======== 下载 ========
async function downloadApp(id, packageName) {
  // 获取应用详情
  const res = await fetch(`${API}/apps/${id}`).then(r => r.json());
  const app = res.data;
  const downloadUrl = resolveUrl(app.download_url || app.apk_url);

  // 增加下载计数
  fetch(`${API}/apps/${id}/download`, { method: 'POST' }).catch(() => {});

  if (!downloadUrl) {
    alert('该应用暂无下载地址');
    return;
  }

  const fileName = (app.name || packageName || 'app') + '.apk';

  // APK 内：使用 Android 原生 DownloadManager，不跳浏览器
  if (window.NativeDownload && window.NativeDownload.download) {
    window.NativeDownload.download(downloadUrl, fileName);
    showToast(`已加入下载队列：${app.name || packageName}`);
    return;
  }

  // Web 浏览器回退
  const link = document.createElement('a');
  link.href = downloadUrl;
  link.download = fileName;
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  setTimeout(() => link.remove(), 1000);
  showToast(`开始下载：${app.name || packageName}`);
}

function showToast(msg) {
  const existing = document.getElementById('tv-toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.id = 'tv-toast';
  toast.textContent = msg;
  toast.style.cssText = 'position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.78); color:#fff; padding:12px 28px; border-radius:8px; font-size:16px; z-index:100; pointer-events:none;';
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

// ======== 返回 ========
function goBack() {
  hideAllPages();
  document.getElementById('top-bar').style.display = '';
  document.getElementById('main-content').style.display = '';
  currentPage = 'main';
  switchPage('main');
  renderHome();
}

// ======== 工具函数 ========
function hideAllPages() {
  document.getElementById('main-content').style.display = 'none';
  document.getElementById('top-bar').style.display = 'none';
  document.getElementById('detail-page').classList.remove('active');
  document.getElementById('search-page').classList.remove('active');
  document.getElementById('category-apps-page').classList.remove('active');
}

function switchPage(page) {
  currentPage = page;
  collectFocusables();
  focusIndex = 0;
  updateFocus();
}

function setTab(tab) {
  document.querySelectorAll('.top-tab').forEach(t => {
    t.classList.remove('active', 'focused');
    if (t.dataset.tab === tab) t.classList.add('active');
  });
  currentTab = tab;
}

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ======== 按键提示自动隐藏 ========
let hintTimer;
const navHint = document.querySelector('.nav-hint');

function showHintBriefly() {
  if (!navHint) return;
  navHint.classList.remove('hidden');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => navHint.classList.add('hidden'), 4000);
}

// 页面加载 4 秒后自动隐藏；任何按键/点击/触摸都会重新显示并刷新倒计时
window.addEventListener('load', () => {
  showHintBriefly();
});
['click', 'touchstart', 'keydown'].forEach(evt => {
  document.addEventListener(evt, showHintBriefly, true);
});

// ======== 键盘导航 ========
document.addEventListener('keydown', (e) => {
  showHintBriefly();
  collectFocusables();
  if (focusableElements.length === 0) return;

  switch(e.key) {
    case 'ArrowRight':
      e.preventDefault();
      focusIndex = (focusIndex + 1) % focusableElements.length;
      updateFocus();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      focusIndex = (focusIndex - 1 + focusableElements.length) % focusableElements.length;
      updateFocus();
      break;
    case 'ArrowDown':
      e.preventDefault();
      // 尝试向下移动：在卡片网格中找一个合适的下一个元素
      moveFocusVertical(1);
      break;
    case 'ArrowUp':
      e.preventDefault();
      moveFocusVertical(-1);
      break;
    case 'Enter':
      e.preventDefault();
      const focused = focusableElements[focusIndex];
      if (focused) {
        focused.click();
        // 如果是搜索输入框，手动聚焦
        if (focused.tagName === 'INPUT') focused.focus();
      }
      break;
    case 'Escape':
      e.preventDefault();
      if (currentPage === 'detail' || currentPage === 'search' || currentPage === 'category-apps') {
        goBack();
      }
      break;
  }
});

function moveFocusVertical(direction) {
  if (focusableElements.length === 0) return;
  const current = focusableElements[focusIndex];
  const currentRect = current.getBoundingClientRect();
  const currentCenterX = currentRect.left + currentRect.width / 2;
  const currentCenterY = currentRect.top + currentRect.height / 2;

  let bestIndex = -1;
  let bestDistance = Infinity;

  focusableElements.forEach((el, i) => {
    if (i === focusIndex) return;
    const rect = el.getBoundingClientRect();
    const elCenterX = rect.left + rect.width / 2;
    const elCenterY = rect.top + rect.height / 2;

    // 必须在正确的方向
    if (direction > 0 && elCenterY <= currentCenterY) return;
    if (direction < 0 && elCenterY >= currentCenterY) return;

    const dx = elCenterX - currentCenterX;
    const dy = elCenterY - currentCenterY;
    const distance = Math.sqrt(dx * dx + dy * dy * 2); // 垂直权重更高

    if (distance < bestDistance) {
      bestDistance = distance;
      bestIndex = i;
    }
  });

  if (bestIndex >= 0) {
    focusIndex = bestIndex;
    updateFocus();
  }
}

// ======== 启动 ========
renderHome();
</script>
