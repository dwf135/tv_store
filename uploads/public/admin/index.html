<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV 应用商店 - 管理后台</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-light: #6366f1;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1f2937;
    --text-light: #6b7280;
    --border: #e5e7eb;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,.1);
    --shadow-md: 0 4px 6px rgba(0,0,0,.07);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); display:flex; min-height:100vh; }
  /* 侧边栏 */
  .sidebar { width:240px; background:#1e1e2d; color:#fff; display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:100; }
  .sidebar-header { padding:24px 20px; border-bottom:1px solid rgba(255,255,255,.08); }
  .sidebar-header h1 { font-size:18px; font-weight:700; letter-spacing:-.3px; }
  .sidebar-header span { font-size:12px; color:#a0a0b0; display:block; margin-top:4px; }
  .sidebar-nav { flex:1; padding:12px 0; overflow-y:auto; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:10px 20px; color:#a0a0b0; cursor:pointer; transition:.15s; font-size:14px; border:none; background:none; width:100%; text-align:left; }
  .nav-item:hover { color:#fff; background:rgba(255,255,255,.05); }
  .nav-item.active { color:#fff; background:var(--primary); }
  .nav-item .icon { font-size:18px; width:24px; text-align:center; }
  /* 主区域 */
  .main { flex:1; margin-left:240px; padding:32px; }
  .page { display:none; }
  .page.active { display:block; }
  .page-title { font-size:24px; font-weight:700; margin-bottom:24px; }
  /* 卡片 */
  .card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; margin-bottom:20px; }
  .card-title { font-size:16px; font-weight:600; margin-bottom:16px; }
  /* 统计卡片 */
  .stats-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:16px; margin-bottom:24px; }
  .stat-card { background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
  .stat-label { font-size:13px; color:var(--text-light); margin-bottom:8px; }
  .stat-value { font-size:32px; font-weight:700; color:var(--primary); }
  /* 表格 */
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse: collapse; }
  th { text-align:left; padding:12px; border-bottom:2px solid var(--border); font-size:13px; color:var(--text-light); font-weight:600; white-space:nowrap; }
  td { padding:12px; border-bottom:1px solid var(--border); font-size:14px; vertical-align:middle; }
  tr:hover td { background:#f9fafb; }
  /* 按钮 */
  .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border:none; border-radius:6px; font-size:14px; cursor:pointer; font-weight:500; transition:.15s; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-primary:hover { background:var(--primary-light); }
  .btn-success { background:var(--success); color:#fff; }
  .btn-danger { background:var(--danger); color:#fff; }
  .btn-outline { background:#fff; border:1px solid var(--border); color:var(--text); }
  .btn-outline:hover { background:#f9fafb; }
  .btn-sm { padding:4px 10px; font-size:13px; }
  .btn-group { display:flex; gap:8px; flex-wrap:wrap; }
  /* 表单 */
  .form-group { margin-bottom:16px; }
  .form-label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--text); }
  .form-input, .form-select, .form-textarea { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:6px; font-size:14px; transition:.15s; font-family:inherit; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(79,70,229,.10); }
  .form-textarea { min-height:80px; resize:vertical; }
  .form-row { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  .form-row-3 { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:16px; }
  /* 标签 */
  .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
  .badge-success { background:#d1fae5; color:#065f46; }
  .badge-danger { background:#fee2e2; color:#991b1b; }
  .badge-warning { background:#fef3c7; color:#92400e; }
  /* 图标预览 */
  .icon-preview { width:48px; height:48px; border-radius:10px; object-fit:cover; background:#f3f4f6; }
  /* Toast */
  .toast { position:fixed; top:20px; right:20px; padding:12px 20px; border-radius:8px; color:#fff; font-size:14px; font-weight:500; z-index:9999; box-shadow:0 4px 12px rgba(0,0,0,.2); display:none; animation:slideIn .3s; }
  @keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }
  .toast.show { display:block; }
  .toast-success { background:var(--success); }
  .toast-error { background:var(--danger); }
  /* 模态框 */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center; }
  .modal-overlay.show { display:flex; }
  .modal { background:#fff; border-radius:12px; width:90%; max-width:640px; max-height:85vh; overflow-y:auto; padding:32px; box-shadow:0 16px 48px rgba(0,0,0,.15); }
  .modal-title { font-size:20px; font-weight:700; margin-bottom:24px; }
  .modal-actions { display:flex; gap:12px; justify-content:flex-end; margin-top:24px; }
  /* 空状态 */
  .empty { text-align:center; padding:40px; color:var(--text-light); }
  .empty-icon { font-size:48px; margin-bottom:12px; }
  /* 搜索框 */
  .search-bar { display:flex; gap:8px; margin-bottom:16px; }
  .search-bar .form-input { flex:1; max-width:320px; }
  /* 当前图片预览 */
  .current-icon { display:flex; align-items:center; gap:8px; margin-top:6px; }
  .file-hint { font-size:12px; color:var(--text-light); margin-top:4px; }
  /* 登录遮罩 */
  .login-overlay { display:flex; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:9999; align-items:center; justify-content:center; }
  .login-overlay.hide { display:none; }
  .login-card { background:#fff; border-radius:12px; padding:32px 36px; width:360px; box-shadow:0 16px 48px rgba(0,0,0,.2); text-align:center; }
  .login-card h2 { font-size:20px; margin-bottom:4px; }
  .login-subtitle { font-size:13px; color:var(--text-light); margin-bottom:20px; }
  .login-card .form-input { margin-bottom:10px; font-size:16px; padding:12px; text-align:center; letter-spacing:4px; }
  .login-error { font-size:13px; color:var(--danger); margin-bottom:10px; min-height:20px; }
</style>
</head>
<body>

<!-- 侧边栏 -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h1>📺 TV 应用商店</h1>
    <span>管理后台</span>
  </div>
  <nav class="sidebar-nav">
    <button class="nav-item active" data-page="dashboard">
      <span class="icon">📊</span> 数据概览
    </button>
    <button class="nav-item" data-page="apps">
      <span class="icon">📱</span> 应用管理
    </button>
    <button class="nav-item" data-page="categories">
      <span class="icon">📂</span> 分类管理
    </button>
  </nav>
</aside>

<!-- 主内容 -->
<main class="main">

  <!-- 数据概览 -->
  <div class="page active" id="page-dashboard">
    <div class="page-title">📊 数据概览</div>
    <div class="stats-grid" id="stats-grid"></div>
  </div>

  <!-- 应用管理 -->
  <div class="page" id="page-apps">
    <div class="page-title">📱 应用管理</div>
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <div class="search-bar" style="margin-bottom:0;">
          <input type="text" class="form-input" id="app-search" placeholder="搜索应用名称..." oninput="loadApps()">
        </div>
        <button class="btn btn-primary" onclick="openAppModal()">+ 添加应用</button>
      </div>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>图标</th><th>应用名称</th><th>包名</th><th>版本</th><th>分类</th><th>下载量</th><th>状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="apps-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 分类管理 -->
  <div class="page" id="page-categories">
    <div class="page-title">📂 分类管理</div>
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="card-title" style="margin-bottom:0;">分类列表</div>
        <button class="btn btn-primary" onclick="openCategoryModal()">+ 添加分类</button>
      </div>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>图标</th><th>名称</th><th>排序</th><th>操作</th></tr></thead>
          <tbody id="categories-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<!-- 应用编辑模态框 -->
<div class="modal-overlay" id="app-modal">
  <div class="modal">
    <div class="modal-title" id="app-modal-title">添加应用</div>
    <form id="app-form" enctype="multipart/form-data">
      <input type="hidden" id="app-id">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">应用名称 *</label>
          <input type="text" class="form-input" id="app-name" required>
        </div>
        <div class="form-group">
          <label class="form-label">包名 *</label>
          <input type="text" class="form-input" id="app-package" required placeholder="com.example.app">
        </div>
      </div>
      <div class="form-row-3">
        <div class="form-group">
          <label class="form-label">版本号</label>
          <input type="text" class="form-input" id="app-version" value="1.0.0">
        </div>
        <div class="form-group">
          <label class="form-label">大小</label>
          <input type="text" class="form-input" id="app-size" value="0 MB" placeholder="如: 25.6 MB">
        </div>
        <div class="form-group">
          <label class="form-label">开发者</label>
          <input type="text" class="form-input" id="app-developer">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">分类</label>
          <select class="form-select" id="app-category"></select>
        </div>
        <div class="form-group">
          <label class="form-label">应用图标 (PNG/JPG)</label>
          <input type="file" class="form-input" id="app-icon-file" accept="image/*" onchange="previewIcon(this)">
          <div class="current-icon" id="icon-preview-wrap" style="display:none;">
            <img id="app-icon-preview" class="icon-preview" src="">
            <span style="font-size:12px;color:var(--text-light);">当前图标</span>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">应用描述</label>
        <textarea class="form-textarea" id="app-desc" placeholder="描述应用功能..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">APK 文件</label>
          <input type="file" class="form-input" id="app-apk-file" accept=".apk">
          <div class="file-hint">上传 APK 安装包（可选，最大 500MB）</div>
        </div>
        <div class="form-group">
          <label class="form-label">截图 (可多选)</label>
          <input type="file" class="form-input" id="app-screenshots" accept="image/*" multiple>
          <div class="file-hint">可上传多张应用截图</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">直连下载地址</label>
        <input type="text" class="form-input" id="app-download-url" placeholder="https://example.com/app.apk">
        <div class="file-hint">输入直链 URL，优先级高于上传的 APK 文件。留空则使用上传的 APK。</div>
      </div>
      <div class="form-group" style="display:flex; gap:24px;">
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
          <input type="checkbox" id="app-featured"> 首页推荐
        </label>
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
          <input type="checkbox" id="app-recommended"> 编辑精选
        </label>
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
          <input type="checkbox" id="app-status" checked> 启用
        </label>
      </div>
    </form>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeAppModal()">取消</button>
      <button class="btn btn-primary" onclick="saveApp()">保存</button>
    </div>
  </div>
</div>

<!-- 分类编辑模态框 -->
<div class="modal-overlay" id="category-modal">
  <div class="modal">
    <div class="modal-title" id="category-modal-title">添加分类</div>
    <form id="category-form">
      <input type="hidden" id="category-id">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">分类名称 *</label>
          <input type="text" class="form-input" id="category-name" required>
        </div>
        <div class="form-group">
          <label class="form-label">图标 (Emoji)</label>
          <input type="text" class="form-input" id="category-icon" placeholder="📱">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">排序</label>
        <input type="number" class="form-input" id="category-sort" value="0">
      </div>
    </form>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeCategoryModal()">取消</button>
      <button class="btn btn-primary" onclick="saveCategory()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 登录遮罩 -->
<div class="login-overlay" id="login-overlay">
  <div class="login-card">
    <h2>🔐 管理后台登录</h2>
    <p class="login-subtitle">请输入管理密码以继续</p>
    <input type="password" class="form-input" id="login-password" placeholder="请输入密码" autofocus>
    <div class="login-error" id="login-error"></div>
    <button class="btn btn-primary" style="width:100%; justify-content:center; padding:12px;" onclick="doLogin()">登 录</button>
  </div>
</div>

<script>
const API = '/api';

// ======== 登录验证 ========
if (!sessionStorage.getItem('admin_auth')) {
  document.getElementById('login-overlay').classList.remove('hide');
} else {
  document.getElementById('login-overlay').classList.add('hide');
}

document.getElementById('login-password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});

async function doLogin() {
  const pwd = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  try {
    const res = await fetch(`${API}/admin/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    }).then(r => r.json());
    if (res.success) {
      sessionStorage.setItem('admin_auth', '1');
      document.getElementById('login-overlay').classList.add('hide');
      loadStats();
    } else {
      errEl.textContent = res.message || '密码错误';
    }
  } catch (e) {
    errEl.textContent = '网络错误，请检查服务器';
  }
}

// ======== 原脚本 ========

// Toast
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast toast-${type} show`;
  setTimeout(() => t.classList.remove('show'), 2500);
}

// 页面切换
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    item.classList.add('active');
    const page = item.dataset.page;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(`page-${page}`).classList.add('active');
    if (page === 'dashboard') loadStats();
    if (page === 'apps') loadApps();
    if (page === 'categories') loadCategories();
  });
});

// ======== 数据概览 ========
async function loadStats() {
  const res = await fetch(`${API}/stats`).then(r => r.json());
  const d = res.data;
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><div class="stat-label">应用总数</div><div class="stat-value">${d.totalApps}</div></div>
    <div class="stat-card"><div class="stat-label">已启用</div><div class="stat-value">${d.activeApps}</div></div>
    <div class="stat-card"><div class="stat-label">分类数</div><div class="stat-value">${d.totalCategories}</div></div>
    <div class="stat-card"><div class="stat-label">总下载量</div><div class="stat-value">${d.totalDownloads}</div></div>
  `;
}

// ======== 应用管理 ========
async function loadApps() {
  const q = document.getElementById('app-search').value;
  const url = q ? `${API}/apps?keyword=${encodeURIComponent(q)}&pageSize=100` : `${API}/apps/all`;
  const res = await fetch(url).then(r => r.json());
  const apps = res.data;
  const tbody = document.getElementById('apps-table-body');
  if (!apps.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty"><div class="empty-icon">📭</div>暂无应用</td></tr>`;
    return;
  }
  tbody.innerHTML = apps.map(a => `
    <tr>
      <td>${a.icon ? `<img src="${a.icon}" class="icon-preview" style="width:36px;height:36px;">` : '<span style="font-size:24px;">📱</span>'}</td>
      <td><strong>${esc(a.name)}</strong></td>
      <td><code style="font-size:12px;background:#f3f4f6;padding:2px 6px;border-radius:4px;">${esc(a.package_name)}</code></td>
      <td>v${esc(a.version)}</td>
      <td>${esc(a.category_name || '-')}</td>
      <td>${a.download_count}</td>
      <td>${a.status ? '<span class="badge badge-success">启用</span>' : '<span class="badge badge-danger">禁用</span>'}</td>
      <td>
        <div class="btn-group">
          <button class="btn btn-outline btn-sm" onclick="editApp(${a.id})">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="deleteApp(${a.id}, '${esc(a.name)}')">删除</button>
        </div>
      </td>
    </tr>
  `).join('');
}

let editingAppId = null;

async function openAppModal(id) {
  editingAppId = id || null;
  document.getElementById('app-modal-title').textContent = id ? '编辑应用' : '添加应用';
  document.getElementById('app-form').reset();
  document.getElementById('app-id').value = '';
  document.getElementById('app-version').value = '1.0.0';
  document.getElementById('app-size').value = '0 MB';
  document.getElementById('app-status').checked = true;
  document.getElementById('app-featured').checked = false;
  document.getElementById('app-recommended').checked = false;
  document.getElementById('icon-preview-wrap').style.display = 'none';

  // 加载分类列表
  const cats = await fetch(`${API}/categories`).then(r => r.json());
  document.getElementById('app-category').innerHTML = '<option value="">请选择分类</option>' +
    cats.data.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');

  if (id) {
    const res = await fetch(`${API}/apps/${id}`).then(r => r.json());
    const a = res.data;
    document.getElementById('app-id').value = a.id;
    document.getElementById('app-name').value = a.name;
    document.getElementById('app-package').value = a.package_name;
    document.getElementById('app-version').value = a.version;
    document.getElementById('app-size').value = a.size;
    document.getElementById('app-developer').value = a.developer || '';
    document.getElementById('app-desc').value = a.description || '';
    document.getElementById('app-category').value = a.category_id || '';
    document.getElementById('app-featured').checked = !!a.is_featured;
    document.getElementById('app-recommended').checked = !!a.is_recommended;
    document.getElementById('app-status').checked = !!a.status;
    document.getElementById('app-download-url').value = a.download_url || '';
    if (a.icon) {
      document.getElementById('app-icon-preview').src = a.icon;
      document.getElementById('icon-preview-wrap').style.display = 'flex';
    }
  }
  document.getElementById('app-modal').classList.add('show');
}

function closeAppModal() {
  document.getElementById('app-modal').classList.remove('show');
  editingAppId = null;
}

function previewIcon(input) {
  if (input.files?.[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('app-icon-preview').src = e.target.result;
      document.getElementById('icon-preview-wrap').style.display = 'flex';
    };
    reader.readAsDataURL(input.files[0]);
  }
}

async function saveApp() {
  const form = document.getElementById('app-form');
  if (!document.getElementById('app-name').value || !document.getElementById('app-package').value) {
    showToast('请填写应用名称和包名', 'error');
    return;
  }

  const fd = new FormData();
  fd.append('name', document.getElementById('app-name').value);
  fd.append('package_name', document.getElementById('app-package').value);
  fd.append('version', document.getElementById('app-version').value);
  fd.append('size', document.getElementById('app-size').value);
  fd.append('developer', document.getElementById('app-developer').value);
  fd.append('description', document.getElementById('app-desc').value);
  fd.append('category_id', document.getElementById('app-category').value);
  fd.append('is_featured', document.getElementById('app-featured').checked ? '1' : '0');
  fd.append('is_recommended', document.getElementById('app-recommended').checked ? '1' : '0');
  fd.append('status', document.getElementById('app-status').checked ? '1' : '0');
  fd.append('download_url', document.getElementById('app-download-url').value);

  const iconFile = document.getElementById('app-icon-file').files[0];
  if (iconFile) fd.append('icon', iconFile);

  const apkFile = document.getElementById('app-apk-file').files[0];
  if (apkFile) fd.append('apk', apkFile);

  const screenshotFiles = document.getElementById('app-screenshots').files;
  for (let i = 0; i < screenshotFiles.length; i++) {
    fd.append('screenshots', screenshotFiles[i]);
  }

  const url = editingAppId ? `${API}/apps/${editingAppId}` : `${API}/apps`;
  const method = editingAppId ? 'PUT' : 'POST';

  try {
    const res = await fetch(url, { method, body: fd }).then(r => r.json());
    if (res.success) {
      showToast(editingAppId ? '应用已更新' : '应用已添加');
      closeAppModal();
      loadApps();
    } else {
      showToast(res.message || '操作失败', 'error');
    }
  } catch (e) {
    showToast('操作失败: ' + e.message, 'error');
  }
}

function editApp(id) { openAppModal(id); }

async function deleteApp(id, name) {
  if (!confirm(`确定删除应用 "${name}"？此操作不可撤销。`)) return;
  await fetch(`${API}/apps/${id}`, { method: 'DELETE' });
  showToast('应用已删除');
  loadApps();
}

function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ======== 分类管理 ========
async function loadCategories() {
  const res = await fetch(`${API}/categories`).then(r => r.json());
  const cats = res.data;
  const tbody = document.getElementById('categories-table-body');
  if (!cats.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty"><div class="empty-icon">📂</div>暂无分类</td></tr>';
    return;
  }
  tbody.innerHTML = cats.map(c => `
    <tr>
      <td><span style="font-size:24px;">${c.icon || '📱'}</span></td>
      <td><strong>${esc(c.name)}</strong></td>
      <td>${c.sort_order}</td>
      <td>
        <div class="btn-group">
          <button class="btn btn-outline btn-sm" onclick="editCategory(${c.id}, '${esc(c.name)}', '${esc(c.icon||'')}', ${c.sort_order})">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="deleteCategory(${c.id}, '${esc(c.name)}')">删除</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function openCategoryModal(id) {
  document.getElementById('category-modal-title').textContent = id ? '编辑分类' : '添加分类';
  document.getElementById('category-id').value = id || '';
  if (!id) {
    document.getElementById('category-form').reset();
    document.getElementById('category-sort').value = '0';
  }
  document.getElementById('category-modal').classList.add('show');
}

function editCategory(id, name, icon, sort) {
  document.getElementById('category-id').value = id;
  document.getElementById('category-name').value = name;
  document.getElementById('category-icon').value = icon;
  document.getElementById('category-sort').value = sort;
  openCategoryModal(id);
}

function closeCategoryModal() {
  document.getElementById('category-modal').classList.remove('show');
}

async function saveCategory() {
  const id = document.getElementById('category-id').value;
  const data = {
    name: document.getElementById('category-name').value,
    icon: document.getElementById('category-icon').value,
    sort_order: Number(document.getElementById('category-sort').value)
  };
  if (!data.name) { showToast('请输入分类名称', 'error'); return; }

  const url = id ? `${API}/categories/${id}` : `${API}/categories`;
  const method = id ? 'PUT' : 'POST';

  const res = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) }).then(r => r.json());
  if (res.success) {
    showToast(id ? '分类已更新' : '分类已添加');
    closeCategoryModal();
    loadCategories();
  } else {
    showToast(res.message || '操作失败', 'error');
  }
}

async function deleteCategory(id, name) {
  if (!confirm(`确定删除分类 "${name}"？相关应用将变为未分类。`)) return;
  await fetch(`${API}/categories/${id}`, { method: 'DELETE' });
  showToast('分类已删除');
  loadCategories();
}

loadStats();
